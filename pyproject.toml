[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "audio-to-tab-pdf"
version = "0.1.6"
description = "Convert audio to guitar tab PDF (standalone Tab PDF app)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10,<3.13"
dependencies = [
    "basic-pitch[onnx]>=0.3.0",
    "numpy>=1.24,<2",
    "setuptools>=68,<81",
    "pretty_midi>=0.2.10",
    "librosa>=0.10",
    "soundfile>=0.12",
    "reportlab>=4.0",
    "yt-dlp>=2026.08",
    "streamlit>=1.55",
]

[project.optional-dependencies]
demucs = ["demucs>=4.0", "torch>=2.2,<2.14", "torchaudio>=2.2,<2.12", "torchcodec>=0.14,<0.15"]
roformer = ["bs-roformer-infer>=0.1.5"]
separator = ["audio-separator>=0.39.1"]
scnet = ["torch>=2.2,<2.14"]
beat = ["beat-this==1.1.0", "torch>=2.2,<2.14", "torchaudio>=2.2,<2.12"]
gp5 = ["PyGuitarPro==0.11"]
desktop = ["pywebview>=6.2,<7"]
dev = ["pytest>=7.0", "ruff>=0.3"]

[project.scripts]
audio-transcribe = "audio_to_tab.cli.transcribe:main"
audio-mid2tab = "audio_to_tab.cli.mid2tab:main"
audio-tab2pdf = "audio_to_tab.cli.tab2pdf:main"
audio-pipeline = "audio_to_tab.cli.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["audio_to_tab*"]
exclude = ["tests*", "ui*"]

[tool.pytest.ini_options]
markers = [
    "youtube: hits the public internet (skipped unless RUN_YOUTUBE_INTEGRATION=1)",
    "slow: heavy optional integration (model or long audio)",
]

[tool.ruff]
line-length = 100
target-version = "py310"
lint.select = ["E4", "E7", "E9", "F", "I", "UP", "B", "C4", "SIM", "RUF", "PIE"]
lint.ignore = ["E501", "BLE001", "S110", "S112", "RUF001", "RUF002", "RUF003"]
